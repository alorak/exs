<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="EXS — tarayıcıda çalışan bilimsel WYSIWYG belge ve matematik editörü." />
  <title>EXS — Scientific Editor</title>
  <link rel="stylesheet" href="./styles.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/mathlive"></script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark">∑</div>
      <div>
        <strong>EXS</strong>
        <span>Scientific Editor</span>
      </div>
    </div>

    <div class="document-title-wrap">
      <input id="documentTitle" class="document-title" value="Adsız bilimsel belge" aria-label="Belge adı" />
      <span id="saveState" class="save-state">Kaydedildi</span>
    </div>

    <div class="header-actions" aria-label="Belge işlemleri">
      <button id="newButton" class="icon-action" type="button" title="Yeni belge" aria-label="Yeni belge">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M12 11v6M9 14h6"/></svg>
      </button>
      <button id="openButton" class="icon-action" type="button" title="Belge aç" aria-label="Belge aç">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h7l2 2h9"/><path d="M4 7v12h15l2-8H7l-3 8"/></svg>
      </button>
      <button id="saveButton" class="icon-action" type="button" title="Kaydet (.exs)" aria-label="Kaydet">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12l2 2v16H5z"/><path d="M8 3v6h8V3"/><path d="M8 14h8v7"/></svg>
      </button>
      <span class="header-separator" aria-hidden="true"></span>
      <button id="printButton" class="icon-action" type="button" title="Yazdır / PDF" aria-label="Yazdır veya PDF oluştur">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3h10v6"/><path d="M6 18H4v-7h16v7h-2"/><path d="M7 15h10v6H7z"/><path d="M17 12h.01"/></svg>
      </button>
      <div class="export-menu header-export">
        <button id="exportButton" class="icon-action" type="button" title="Dışa aktar" aria-label="Dışa aktar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m8 11 4 4 4-4"/><path d="M5 19h14"/></svg>
        </button>
        <div id="exportPopover" class="popover" hidden>
          <button data-export="latex">LaTeX (.tex)</button>
          <button data-export="html">HTML (.html)</button>
          <button data-export="text">Düz metin (.txt)</button>
        </div>
      </div>
      <input id="openInput" type="file" accept=".exs,.json,application/json" hidden />
    </div>
  </header>

  <nav class="menu-bar" aria-label="Ana menü">
    <button class="toolbar-icon" data-menu-action="undo" title="Geri al (Ctrl/Cmd+Z)" aria-label="Geri al">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 7-5 5 5 5"/><path d="M5 12h8a6 6 0 0 1 6 6"/></svg>
    </button>
    <button class="toolbar-icon" data-menu-action="redo" title="Yinele (Ctrl/Cmd+Y)" aria-label="Yinele">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 7 5 5-5 5"/><path d="M19 12h-8a6 6 0 0 0-6 6"/></svg>
    </button>
    <span class="menu-separator"></span>

    <select id="blockStyle" title="Paragraf stili">
      <option value="p">Normal</option>
      <option value="h1">Başlık 1</option>
      <option value="h2">Başlık 2</option>
      <option value="h3">Başlık 3</option>
      <option value="blockquote">Alıntı</option>
    </select>

    <button data-command="bold" title="Kalın (Ctrl/Cmd+B)"><b>B</b></button>
    <button data-command="italic" title="İtalik (Ctrl/Cmd+I)"><i>I</i></button>
    <button data-command="underline" title="Altı çizili"><u>U</u></button>
    <button data-command="superscript" title="Üst simge">x²</button>
    <button data-command="subscript" title="Alt simge">x₂</button>

    <span class="menu-separator"></span>

    <div id="mathToolbar" class="math-toolbar" aria-label="Dinamik matematik araçları">
      <button class="math-tool" data-latex="\displaystyle\sum_{\placeholder{i=1}}^{\placeholder{n}}\placeholder{x_i}" title="Toplam">∑</button>
      <button class="math-tool" data-latex="\displaystyle\prod_{\placeholder{i=1}}^{\placeholder{n}}\placeholder{x_i}" title="Çarpım">∏</button>
      <button class="math-tool" data-latex="\displaystyle\int_{\placeholder{a}}^{\placeholder{b}}\placeholder{f(x)}\,d\placeholder{x}" title="İntegral">∫</button>
      <button class="math-tool fraction-tool" data-latex="\displaystyle\frac{\placeholder{a}}{\placeholder{b}}" title="Kesir" aria-label="Kesir ekle">
        <svg class="fraction-tool-icon" viewBox="0 0 28 28" aria-hidden="true">
          <rect x="9" y="3.5" width="10" height="6" rx="1.2"/>
          <path d="M5 14h18"/>
          <rect x="9" y="18.5" width="10" height="6" rx="1.2"/>
        </svg>
      </button>
      <button class="math-tool" data-latex="\sqrt{\placeholder{x}}" title="Karekök">√</button>
      <button class="math-tool math-tool-wide" data-latex="\lim_{\placeholder{x}\to\placeholder{a}}\placeholder{f(x)}" title="Limit">lim</button>
      <button class="math-tool" data-latex="\left(\placeholder{x}\right)" title="Parantez">( )</button>
      <button class="math-tool" data-latex="\vec{\placeholder{v}}" title="Vektör">v⃗</button>
      <button class="math-tool" data-latex="\begin{bmatrix}\placeholder{a}&\placeholder{b}\\\placeholder{c}&\placeholder{d}\end{bmatrix}" title="2×2 matris">▦</button>
    </div>

    <button id="inlineMathButton" class="toolbar-symbol" title="İmleçte boş matematik alanı" aria-label="Boş matematik alanı">ƒx</button>
    <button id="displayMathButton" class="toolbar-icon" title="Numaralı canlı denklem ekle" aria-label="Numaralı denklem ekle">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M4 12h7M4 17h10"/><path d="M18 8v8"/><path d="M16.5 10 18 8l1.5 2"/></svg>
    </button>
    <button id="tableButton" class="toolbar-icon" title="3×3 tablo ekle" aria-label="Tablo ekle">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18M3 14h18M9 4v16M15 4v16"/></svg>
    </button>
    <button id="imageButton" class="toolbar-icon" title="Görsel ekle" aria-label="Görsel ekle">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m5 18 5-5 3 3 2-2 4 4"/></svg>
    </button>
    <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml" hidden />

    <span class="menu-separator"></span>

    <button id="findButton" class="toolbar-icon" title="Bul / değiştir (Ctrl/Cmd+F)" aria-label="Bul ve değiştir">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
    </button>
  </nav>

  <main class="app-shell">
    <aside class="left-sidebar panel">
      <div class="panel-heading">
        <strong>Belge</strong>
      </div>
      <div class="sidebar-tabs" role="tablist">
        <button class="tab-button active" data-tab="outline">İçindekiler</button>
        <button class="tab-button" data-tab="equations">Denklemler</button>
      </div>
      <div id="outlinePanel" class="side-content"></div>
      <div id="equationsPanel" class="side-content" hidden></div>
    </aside>

    <section class="workspace" aria-label="Belge çalışma alanı">
      <div id="page" class="page">
        <article id="editor" class="editor" contenteditable="true" spellcheck="true" aria-label="Bilimsel belge editörü"></article>
      </div>
    </section>

    <aside class="right-sidebar panel">
      <div class="panel-heading">
        <strong>Bilimsel araçlar</strong>
      </div>

      <section class="tool-section">
        <h3>Matematik yapıları</h3>
        <div class="template-grid">
          <button class="fraction-template-button" data-latex="\frac{\placeholder{a}}{\placeholder{b}}" title="Kesir" aria-label="Kesir ekle">
            <span class="fraction-template-icon" aria-hidden="true"><span>a</span><i></i><span>b</span></span>
          </button>
          <button data-latex="\sqrt{\placeholder{x}}">√x</button>
          <button data-latex="\placeholder{x}^{\placeholder{n}}">xⁿ</button>
          <button data-latex="\sum_{i=1}^{n}\placeholder{x_i}">Σ</button>
          <button data-latex="\int_{\placeholder{a}}^{\placeholder{b}}\placeholder{f(x)}\,dx">∫</button>
          <button data-latex="\lim_{x\to\placeholder{a}}\placeholder{f(x)}">lim</button>
          <button data-latex="\frac{\partial \placeholder{f}}{\partial \placeholder{x}}">∂</button>
          <button data-latex="\begin{bmatrix}a&b\\c&d\end{bmatrix}">[ ]</button>
        </div>
      </section>

      <section class="tool-section">
        <h3>Yunan harfleri</h3>
        <div id="greekPalette" class="symbol-grid"></div>
      </section>

      <section class="tool-section">
        <h3>Semboller</h3>
        <div id="symbolPalette" class="symbol-grid"></div>
      </section>

      <section class="tool-section">
        <h3>Belge ayarları</h3>
        <label class="field-label" for="authorInput">Yazar</label>
        <input id="authorInput" class="text-input" placeholder="Yazar / araştırmacı" />
        <label class="field-label" for="zoomRange">Yakınlaştırma <span id="zoomValue">100%</span></label>
        <input id="zoomRange" type="range" min="70" max="140" value="100" step="5" />
      </section>
    </aside>
  </main>

  <footer class="status-bar">
    <span id="wordCount">0 kelime</span>
    <span id="charCount">0 karakter</span>
    <span id="equationCount">0 denklem</span>
    <span class="status-spacer"></span>
    <span>Yerel otomatik kayıt açık</span>
  </footer>

  <dialog id="equationDialog" class="dialog">
    <form method="dialog" class="dialog-card" id="equationForm">
      <header>
        <div>
          <h2 id="equationDialogTitle">Denklem ekle</h2>
          <p>LaTeX yazın veya sağdaki bilimsel paleti kullanın.</p>
        </div>
        <button value="cancel" class="icon-button" aria-label="Kapat">×</button>
      </header>

      <div class="equation-editor-wrap">
        <math-field id="equationEditor" smart-fence math-virtual-keyboard-policy="manual" aria-label="Denklem editörü"></math-field>
      </div>

      <div class="dialog-fields" id="displayEquationFields">
        <label>
          <span>Etiket (opsiyonel)</span>
          <input id="equationLabel" class="text-input" placeholder="örn. schrodinger" />
        </label>
      </div>

      <footer>
        <button value="cancel" class="ghost-button">İptal</button>
        <button id="equationInsertButton" value="default" class="primary-button">Ekle</button>
      </footer>
    </form>
  </dialog>

  <dialog id="findDialog" class="dialog small-dialog">
    <form method="dialog" class="dialog-card" id="findForm">
      <header>
        <div>
          <h2>Bul ve değiştir</h2>
          <p>Metin içeriğinde arama yapar.</p>
        </div>
        <button value="cancel" class="icon-button" aria-label="Kapat">×</button>
      </header>
      <label>
        <span>Bul</span>
        <input id="findInput" class="text-input" />
      </label>
      <label>
        <span>Şununla değiştir</span>
        <input id="replaceInput" class="text-input" />
      </label>
      <footer>
        <button id="findNextButton" value="noop" class="ghost-button">Sonrakini bul</button>
        <button id="replaceButton" value="noop" class="ghost-button">Değiştir</button>
        <button id="replaceAllButton" value="noop" class="primary-button">Tümünü değiştir</button>
      </footer>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="./app.js"></script>
</body>
</html>
